pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "renpy-android-runtime"

// The upstream RAPT module is staged by tools/prepare.py, not checked in.
def staged = file("build/staging/renpyandroid")
if (!new File(staged, "build.gradle").exists()) {
    throw new GradleException("Run `python3 tools/prepare.py` first: build/staging is missing.")
}

include ":renpyandroid", ":app"
project(":renpyandroid").projectDir = staged

// JoiPlay's virtual gamepad (MIT), see third_party/joiplay/README.md. joipad refers
// to the other two as :commons and :sdp.
include ":joipad", ":commons", ":sdp"
project(":joipad").projectDir = file("third_party/joiplay/joipad")
project(":commons").projectDir = file("third_party/joiplay/commons")
project(":sdp").projectDir = file("third_party/joiplay/sdp")
